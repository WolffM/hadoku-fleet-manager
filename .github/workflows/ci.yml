name: CI

# DELIBERATELY UNFILTERED on pull_request. `check` is this repo's required
# status context (seeded by reconcile-repo-policy), and a required check that
# never runs never reports — a `paths:` filter would leave some PRs merging with
# nothing verified and others waiting forever. Scoping belongs inside the job,
# never on the trigger.
#
# ALSO ON PUSH TO MAIN, because pushing straight to main is sanctioned here.
# A pull_request-only CI would check nothing on the path work actually takes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # MUST be named `check`. reconcile-repo-policy seeds `check` as the required
  # context for a new fleet repo; rename this job and every PR becomes
  # permanently unmergeable waiting on a context that never reports.
  #
  # AN OUTSIDE AUTHOR'S PR NEVER REACHES A CLAW. This repo is public, and
  # `pull_request` runs the PR's code — on a self-hosted runner, a shell on a
  # fleet node. The fleet's standard guard (17 repos carry it verbatim, and
  # hadoku_site's reconcile-repo-policy checks for it) sends any author who is not
  # OWNER/MEMBER/COLLABORATOR to a hosted runner. That job cannot pass — a
  # fork's PR gets no secrets, so it cannot fetch the registry token — but it
  # REPORTS, which a required check must. The repo's "require approval for all
  # external contributors" setting is the lock that matters: a fork can edit
  # this file, and approval is what stops that edit from running at all.
  check:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && '["ubuntu-latest"]') || vars.CI_RUNNER) }}
    timeout-minutes: 15
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      # Credentials only — the network-literal half (LAN, tailnet, MACs) is
      # scripts/lib/publish-safety-guard.test.mjs inside `pnpm run check`.
      # Before Install so node_modules is not scanned. Pinned by checksum: a
      # secret scanner fetched unverified is the one download that must not be
      # trusted blind.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks dir "$GITHUB_WORKSPACE" --redact --no-banner

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'

      # pnpm via corepack, pinned by `packageManager`. Replaces pnpm/action-setup,
      # whose self-installer shares one directory across every runner instance on
      # the host and dies with `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - name: Registry token from the vault
        uses: WolffM/hadoku-actions/vault-fetch@v1
        with:
          keys: HADOKU_NPM_READ_TOKEN
        env:
          HADOKU_VAULT_KEY: ${{ secrets.KEY_SERVICE_FLEET_MANAGER }}

      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ env.HADOKU_NPM_READ_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Check
        # publish-safety-guard reads its denylist from here; absent, it FAILS.
        env:
          PUBLISH_DENYLIST: ${{ secrets.PUBLISH_DENYLIST }}
        run: pnpm run check

      # A red run is seen by nobody unless it says so itself: nothing polls
      # these repos. `always()` so RECOVERIES report too -- without the success
      # side the alert state stays broken and the next real failure arrives as a
      # suppressed reminder rather than a new alert.
      - name: Report the outcome so a silent failure can't hide
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: fleet-manager:ci
          service-key: ${{ secrets.KEY_SERVICE_FLEET_MANAGER }}
          started-at: ${{ env.JOB_STARTED_AT }}
