[Slice]
# A hard disk cap on everything the desktop user runs outside CI: agent tmux
# panes, their builds and test suites. Weights cannot do this on hokon: io.cost's
# auto model rates the root NVMe at 1.7 GB/s, so at the 400 MB/s the panes
# wrote on 2026-11-27 it saw no contention and throttled nothing, while btrfs
# over dm-crypt stalled every writer on the box. mgmt-api (pm2-hadoku.service)
# blocked its event loop 4-22 s at a time on 17-byte writeFileSyncs and file
# refaults, and the command station's grant read and a friend-key mint both ran
# past the edge's 30 s. With this cap, measured the same hour: pm2-hadoku io
# pressure avg60 43% -> 1.6%, mgmt-api's worst event-loop stall 22 s -> 52 ms.
#
# The device is the root LV; the kernel attaches the limit to the dm-crypt
# device under it (254:0), which every root-filesystem bio passes through.
IOWriteBandwidthMax=/dev/mapper/hokon--vg-root 120M
IOReadBandwidthMax=/dev/mapper/hokon--vg-root 250M
