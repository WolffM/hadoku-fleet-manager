[Slice]
# A hard disk cap on everything the desktop user runs outside CI: agent tmux
# panes, their builds and test suites. Weights cannot do this on hokon: io.cost's
# auto model rates the root NVMe at 1.7 GB/s, so at the 400 MB/s the panes
# wrote on 2026-11-27 it saw no contention and throttled nothing, while btrfs
# over dm-crypt stalled every writer on the box.
#
# 120M/250M (2026-11-27, #171) held, and was not enough. atop for the two
# all-claw heartbeat losses after it (2026-11-27 05:32Z and 06:39Z): app.slice's
# CHARGED writes stayed at 26-94 MB/s, yet the root LV sat 97-98% busy at
# 119-263 MB/s of device writes, because btrfs metadata/commit and dm-crypt
# writeback are charged to no cgroup (roughly 1-2x the charged bytes on top).
# The device saturates near 300 MB/s combined on this stack (#158: 84-86% util
# at 147 MB/s read + 164 MB/s write). So the cap is sized to the DEVICE:
# 60M charged writes stays under ~180 MB/s device-side even at 2x overhead.
# Agents building slower is the intended cost (operator, 2026-11-25).
#
# The device is the root LV; the kernel attaches the limit to the dm-crypt
# device under it (254:0), which every root-filesystem bio passes through.
IOWriteBandwidthMax=/dev/mapper/hokon--vg-root 60M
IOReadBandwidthMax=/dev/mapper/hokon--vg-root 150M
