[Slice]
# Claim the user manager's memory floor so CI gets none of it.
#
# cgroup2 is mounted memory_recursiveprot: protection a parent holds and its
# children do not claim is shared out by usage, so ci.slice (min=0, low=0)
# still received a slice of user@1000's hand-set Min 8G / Low 12G. With
# session.slice (Low 4G), vpnbypass.slice (Low 10G) and app.slice (Low 3G)
# claiming only what they use, ~3.4G of the floor spilled onto CI. Claimed
# here in full, reclaim reaches CI before the desktop and agent sessions.
MemoryMin=8G
MemoryLow=8G
