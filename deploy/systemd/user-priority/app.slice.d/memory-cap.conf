[Slice]
# A memory ceiling on every agent pane, so a runaway is throttled and then
# killed HERE, not paid for by pm2-hadoku.service (prod) or the swap device.
#
# 2026-11-28 09:31Z: a pane's pytest grew 0.36 -> 3.9 GB in two minutes while
# prod's cgroup sat at its own MemoryHigh; app.slice had no ceiling at all and
# held 19 GB RAM + 17.7 GB swap. In 2026-11-27's events total swap reached
# 33-40 GB, past swap-black's 32 GB, so 1-9 GB spilled onto /swapfile-invoke on
# the ROOT btrfs, the same device prod writes to.
#
#   MemoryHigh=24G     ~5 GB over the measured 19 GB (8.6 anon + 11 page cache).
#                      Over it the panes reclaim their own cache and slow down.
#   MemoryMax=28G      the cgroup OOM killer then takes the largest task in
#                      app.slice (a runaway test, not a ~0.5 GB claude session).
#   MemorySwapMax=20G  keeps total swap under swap-black's 32 GB, so nothing
#                      spills onto the root disk.
MemoryHigh=24G
MemoryMax=28G
MemorySwapMax=20G
