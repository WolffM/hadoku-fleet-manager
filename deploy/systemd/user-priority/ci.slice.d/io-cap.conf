[Slice]
# hokon's minted CI (this ci.slice) gets the same device-sized disk cap as the
# agent panes (app.slice.d/io-cap.conf). It had none: on 2026-11-28 ~12:10Z a
# cardtable e2e chrome on hokon overflow wrote 477 MB in 8 s while bomberman's
# rust-lld ran in a pane, and host io PSI read 88-98%. CI loses to prod.
IOWriteBandwidthMax=/dev/mapper/hokon--vg-root 60M
IOReadBandwidthMax=/dev/mapper/hokon--vg-root 150M
