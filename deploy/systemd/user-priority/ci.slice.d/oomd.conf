[Slice]
# The CI kill rule that actually covers hokon's runners. Every minted runner
# lives in THIS (user-manager) ci.slice; /etc/systemd/system/ci.slice.d/10-oomd.conf
# sits on the system manager's ci.slice, which has no cgroup on hokon at all.
#
# 2026-11-21 07:57-09:07Z: three units filled ci-runner.slice to its 12G
# MemoryHigh and were throttled there for an hour (memory.events high=7.7M,
# 1.2-2 T read off the NVMe PM2 swaps to) while nothing killed them. MemoryHigh
# stays: it keeps the pressure inside this cgroup, where oomd can see it. This
# rule turns an hour of thrash into one killed CI job, which reruns.
#
# 50%/30s matches that incident's shape (sustained, not a burst) with margin.
# perf samples record ciMemSome so a tighter limit is chosen from data.
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMMemoryPressureDurationSec=30s
