# Installed to /etc/systemd/system/-.slice.d/10-oomd-root-slice.conf
#
# The last line of defence against a runaway process taking the whole host down.
# When total swap usage crosses systemd-oomd's SwapUsedLimit (90% by default),
# oomd kills the descendant cgroup using the most swap.
#
# This exists because the cgroup limits in ci-runner.slice only bind the things
# INSIDE them. The two incidents that actually took hokon down were both
# outside: ComfyUI under the `conjure` app (50 GB, 2026-08-04) and InvokeAI
# (32.4 GB RSS + 5.6 GB swap, 2026-08-11). Capping CI does nothing about either.
#
# ============================ READ THIS BEFORE EDITING ======================
# The directive is ManagedOOMSwap. It is NOT ManagedOOMSwapUsed.
#
# systemd does not reject an unknown key — it logs
#
#   /etc/systemd/system/-.slice.d/10-oomd-root-slice.conf:4:
#     Unknown key 'ManagedOOMSwapUsed' in section [Slice], ignoring.
#
# once at boot, into a journal nobody reads, and carries on with the protection
# silently absent. It sat that way from 2026-08-05 until 2026-08-11, when
# InvokeAI drove the box into swap-thrash: journald's own watchdog timed out at
# 13:05, the desktop compositor hung, and the host had to be power-cycled at
# 13:13. oomd was running and enabled the entire time, monitoring nothing.
#
# A config that is present, plausible and inert is worse than one that is
# missing, because every glance at it says "handled". install-oomd-hardening.sh
# therefore ASSERTS the effective value after installing rather than trusting
# that a successful write means a loaded directive.
# ===========================================================================

[Slice]
ManagedOOMSwap=kill
