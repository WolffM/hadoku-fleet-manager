# Installed to /etc/systemd/system/pm2-hadoku.service.d/65-memory-floor.conf
# (sorts after 60-priority.conf, so its MemoryLow wins).
[Service]
# Sized to the measured working set, not a guess: 2026-11-21 anon 8.6G with
# 4.0G already pushed to swap (~12.6G), MemoryPeak 21.5G. MemoryMin is the
# part the kernel will not reclaim at all; MemoryLow is reclaimed only once
# every unprotected cgroup has given its pages back.
MemoryMin=12G
MemoryLow=16G
