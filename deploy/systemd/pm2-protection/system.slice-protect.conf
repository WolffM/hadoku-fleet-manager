# Installed to /etc/systemd/system/system.slice.d/50-protect-pm2.conf
[Slice]
# The ceiling on every protection below system.slice. cgroup2 is mounted
# memory_recursiveprot: a child's effective memory.min/low cannot exceed its
# ancestors'. system.slice sat at min=0/low=0, so pm2-hadoku's MemoryLow=8G,
# journald's 128M, oomd's 64M and tailscaled's 256M Mins protected nothing,
# while the user tree held a hand-set Min 8G / Low 12G. On 2026-11-21
# 07:57-09:07Z the kernel reclaimed PM2 to spare CI and froze cardtable prod.
#
# Sized to the children it carries: pm2 12G/16G plus ~0.5G for the services
# above. Hard Min across the box is then 13G (here) + 8G (user tree) of 62G.
MemoryMin=13G
MemoryLow=17G
