# Installed to /etc/systemd/system/ci.slice.d/10-oomd.conf
#
# ci.slice is the IMPLICIT parent of ci-runner.slice (systemd reads '-' in a
# slice name as a hierarchy separator, so ci-runner.slice lives at the cgroup
# path /ci.slice/ci-runner.slice). It has no unit file of its own — only this
# drop-in — which is exactly why it went untracked and drifted.
#
# MemoryHigh HERE IS THE EFFECTIVE CEILING FOR CI, not the value in
# ci-runner.slice. A parent's MemoryHigh binds its whole subtree, so this 8G
# overrides the 12G the child declares and documents. Read them together:
# ci-runner.slice's 12G/16G is the child's own reservation, and CI actually
# starts reclaiming at 8G. Two real jobs measured 2026-08-05 peaked the slice
# at 0.79 GB, so both numbers are far above anything observed — but if you
# raise CI's budget, raise it HERE, or nothing changes.

[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
# CI must never win a fight against the desktop.
MemoryHigh=8G
