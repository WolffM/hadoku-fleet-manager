# Installed to /etc/systemd/system/tailscaled.service.d/70-logs-tmpfs.conf
# by deploy/systemd/hokon-prod-guard/install.sh (hadoku-fleet-manager).
#
# tailscaled's log buffer (logtail's filch files) off the root LV, onto tmpfs.
# tailscaled is userspace WireGuard: every tailnet packet to every claw passes
# through it. On 2026-11-27 (04:09Z, 05:32Z, 06:39Z) the root LV (btrfs on
# dm-crypt) sat 95-98% busy, tailscaled had threads in D state, and every
# claw lost the coordinator at once. A buffered write on that btrfs blocks in
# metadata reservation behind writeback, and a logger blocked on it holds up
# whatever logs next. tailscaled wrote 9.8 GB / 601k writes to the root LV in
# its 4.5 days before this. Its state file stays on disk (it is rarely written,
# and must survive a reboot); the logs do not need to.
[Service]
Environment=TS_LOGS_DIR=/run/tailscale-logs
RuntimeDirectory=tailscale-logs
RuntimeDirectoryPreserve=yes
